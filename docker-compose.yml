services:
  db:
    image: postgis/postgis:16-3.4
    container_name: tronno-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tronno_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tronno_password}
      POSTGRES_DB: ${POSTGRES_DB:-tronno_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tronno_user} -d ${POSTGRES_DB:-tronno_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tronno-backend
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-tronno_user}:${POSTGRES_PASSWORD:-tronno_password}@db:5432/${POSTGRES_DB:-tronno_db}}
      - POSTGRES_HOST=db
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tronno-frontend
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend

volumes:
  postgres_data:
    name: tronno_postgres_data
